<script>
// =====================================================
// ZVUK
// =====================================================
let soundOn = true;
let musicOn = true;
let actx = null;
function getCtx() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur = 0.08, type = "triangle", vol = 0.04) {
  if (!soundOn) return;
  try {
    const c = getCtx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch (e) {}
}
const sfxClick = () => tone(520, 0.05, "square", 0.02);
const sfxMail  = () => { tone(880, 0.12, "triangle", 0.03); setTimeout(() => tone(1175, 0.15, "triangle", 0.03), 120); };

// =====================================================
// HUDBA – klidná geek lo-fi, bez bubnů
// 1) pokud existuje lofi.mp3, přehraje se ve smyčce
// 2) jinak se zapne vestavěná měkká smyčka (pady + občasné plucky)
// =====================================================
let bgAudio = null;

const progression = [
  [220.00, 261.63, 329.63, 392.00],  // Am7
  [174.61, 220.00, 261.63, 329.63],  // Fmaj7
  [261.63, 329.63, 392.00, 493.88],  // Cmaj7
  [196.00, 246.94, 293.66, 392.00]   // G
];
const melodyNotes = [523.25, 587.33, 659.25, 783.99, 880.00];
const BAR = 4.0;              // pomalejší takt = klidnější
const MASTER_VOL = 0.12;      // tišší celková hlasitost
let musicTimer = null;
let musicStep = 0;

function padNote(freq, when, dur, vol, dest) {
  const c = getCtx();
  [-6, 6].forEach(det => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = freq; o.detune.value = det;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 1.2);
    g.gain.linearRampToValueAtTime(0, when + dur);
    o.connect(g); g.connect(dest);
    o.start(when); o.stop(when + dur + 0.1);
  });
}
function softPluck(freq, when, dest) {
  const c = getCtx();
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.25, when + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, when + 2.4);
  o.connect(g); g.connect(dest);
  o.start(when); o.stop(when + 2.5);
}
function musicBar() {
  if (!musicOn) return;
  try {
    const c = getCtx();
    const t0 = c.currentTime + 0.05;

    const master = c.createGain();
    master.gain.value = MASTER_VOL;
    master.connect(c.destination);

    const warm = c.createBiquadFilter();
    warm.type = "lowpass"; warm.frequency.value = 900; warm.Q.value = 0.3;
    warm.connect(master);

    const chord = progression[musicStep % progression.length];
    chord.forEach((f, i) => padNote(f, t0 + i * 0.12, BAR * 1.1, 0.014, warm));

    // jemný bas (bez rytmu)
    const bass = c.createOscillator(), bg = c.createGain();
    bass.type = "sine"; bass.frequency.value = chord[0] / 2;
    bg.gain.setValueAtTime(0, t0);
    bg.gain.linearRampToValueAtTime(0.025, t0 + 0.6);
    bg.gain.linearRampToValueAtTime(0, t0 + BAR);
    bass.connect(bg); bg.connect(warm);
    bass.start(t0); bass.stop(t0 + BAR + 0.1);

    // řídké plucky melodie
    [1.0, 2.8].forEach((off, i) => {
      if (Math.random() < 0.5) {
        const note = melodyNotes[(musicStep * 2 + i) % melodyNotes.length];
        softPluck(note, t0 + off, warm);
      }
    });

    musicStep++;
  } catch (e) {}
}
function startProcedural() {
  if (!musicOn || musicTimer) return;
  musicBar();
  musicTimer = setInterval(musicBar, BAR * 1000);
}
function stopProcedural() {
  clearInterval(musicTimer);
  musicTimer = null;
}

function startMusic() {
  if (!musicOn) return;
  if (bgAudio && !bgAudio.paused) return;
  try {
    if (!bgAudio) {
      bgAudio = new Audio("lofi.mp3");
      bgAudio.loop = true;
      bgAudio.volume = 0.25;
      bgAudio.onerror = () => { bgAudio = null; startProcedural(); };
    }
    bgAudio.play().catch(() => { bgAudio = null; startProcedural(); });
  } catch (e) {
    startProcedural();
  }
}
function stopMusic() {
  if (bgAudio) bgAudio.pause();
  stopProcedural();
}

// Znělka při volbě Teorie velkého třesku: přestane hudba a přehraje se theme.mp3,
// pokud existuje, jinak vestavěná znělka
function playTheme() {
  stopMusic();
  try {
    const audio = new Audio("theme.mp3");
    audio.volume = 0.6;
    audio.play().catch(() => playFallbackJingle());
  } catch (e) { playFallbackJingle(); }
}
function playFallbackJingle() {
  if (!soundOn) return;
  const c = getCtx();
  const motif = [
    [523.25, 0.18], [659.25, 0.18], [783.99, 0.18], [659.25, 0.18],
    [783.99, 0.35], [1046.5, 0.18], [987.77, 0.18], [1046.5, 0.5]
  ];
  let t = c.currentTime + 0.1;
  motif.forEach(([f, d]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.05);
    t += d;
  });
}

// =====================================================
// KONFETY
// =====================================================
function confetti() {
  const cv = document.getElementById("confetti");
  cv.classList.remove("hidden");
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  const ctx = cv.getContext("2d");
  const colors = ["#ff9fcc", "#ffd966", "#7ad7ff", "#c9a6ff", "#7fff9e"];
  const pieces = Array.from({ length: 140 }, () => ({
    x: Math.random() * cv.width,
    y: -Math.random() * cv.height,
    vx: (Math.random() - 0.5) * 2,
    vy: 2 + Math.random() * 3,
    s: 6 + Math.random() * 6,
    r: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.2,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frames = 0;
  function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    frames++;
    if (frames < 260) requestAnimationFrame(step);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.add("hidden"); }
  }
  step();
}

// =====================================================
// ENGINE
// =====================================================
const $ = id => document.getElementById(id);

function setPic(src) {
  const pic = $("scenePic");
  pic.onerror = () => { pic.removeAttribute("src"); };
  pic.src = src;
}

function render(id) {
  const s = scenes[id];
  const app = $("app");
  app.classList.add("fade");
  setTimeout(() => {
    app.classList.remove("fade");
    $("clock").textContent = s.time;
    setPic(s.img);
    $("text").innerHTML = typeof s.text === "function" ? s.text() : s.text;
    $("buttons").innerHTML = "";

    const choices = (id === "s7")
      ? s.choices.filter(c => !watched.has(c.set[1]))
      : s.choices;

    choices.forEach(c => addButton(c.label, () => { sfxClick(); pick(c); }, "choice"));

    if (s.final) {
      addButton("Hrát znovu", restart, "next");
      confetti();
    }
  }, 350);
}

function addButton(label, onClick, cls) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.onclick = onClick;
  $("buttons").appendChild(b);
}

function showReaction(html, onContinue) {
  $("text").innerHTML = `<div class="reaction">${html}</div>`;
  $("buttons").innerHTML = "";
  addButton("Pokračovat", () => { sfxClick(); onContinue(); }, "next");
}

function pick(c) {
  if (c.set) flags[c.set[0]] = c.set[1];
  if (c.set && c.set[0] === "email") sfxMail();

  if (c.back) {
    watched.add(c.set[1]);
    showReaction(c.reaction, () => render("s7"));
    return;
  }
  if (c.theme) playTheme();
  showReaction(c.reaction, () => render(c.next));
}

function startGame() {
  $("intro").classList.add("hidden");
  $("game").classList.remove("hidden");
  watched = new Set();
  Object.keys(flags).forEach(k => flags[k] = "");
  musicStep = 0;
  stopMusic();
  startMusic();
  render("s1");
}

function restart() {
  stopMusic();
  startGame();
}

// =====================================================
// OVLÁDÁNÍ
// =====================================================
$("startBtn").onclick = () => { sfxClick(); startGame(); };

$("restartBtn").onclick = () => {
  sfxClick();
  restart();
};

$("soundBtn").onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "🔊 zvuk ON" : "🔈 zvuk OFF";
};

$("musicBtn").onclick = e => {
  musicOn = !musicOn;
  e.target.textContent = musicOn ? "🎵 hudba ON" : "🎵 hudba OFF";
  if (musicOn) startMusic(); else stopMusic();
};
